version: 2
updates:
  # Tracker backend dependencies
  - package-ecosystem: "npm"
    directory: "/yourwork/tracker"
    schedule:
      interval: "weekly"
    groups:
      aws-cdk:
        patterns:
          - "aws-cdk*"
          - "@aws-cdk/*"
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
